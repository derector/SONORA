name: SONORA in-app Android update QA
on:
  push:
    branches: [qa/ota-signed-upgrade]
    paths: ['.github/workflows/android-signed-upgrade-qa.yml', '.github/sonora-ota-ui-qa.py']
permissions:
  contents: read
jobs:
  in-app-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed QA baseline with the patched updater
        working-directory: apps/android
        env:
          SONORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SONORA_ANDROID_KEYSTORE_BASE64 }}
          SONORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SONORA_ANDROID_KEYSTORE_PASSWORD }}
          SONORA_ANDROID_KEY_ALIAS: ${{ secrets.SONORA_ANDROID_KEY_ALIAS }}
          SONORA_ANDROID_KEY_PASSWORD: ${{ secrets.SONORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export SONORA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/sonora-qa-release.jks"
          trap 'rm -f "$SONORA_ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$SONORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SONORA_ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease -PsonoraVersionCode=199 -PsonoraVersionName=0.1.199
      - name: Verify GitHub latest matches the UI test target
        run: |
          curl --retry 3 -fsSL https://api.github.com/repos/derector/SONORA/releases/latest |
            jq -e '.tag_name == "v0.1.200"'
      - name: Check, download and install inside SONORA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 -u .github/sonora-ota-ui-qa.py
