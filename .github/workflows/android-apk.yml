name: SONORA Android APK

on:
  push:
    branches: [android-native, "fix/**", "integration/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [android-native]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: sonora-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build stable-signed release APK
        working-directory: apps/android
        env:
          SONORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SONORA_ANDROID_KEYSTORE_BASE64 }}
          SONORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SONORA_ANDROID_KEYSTORE_PASSWORD }}
          SONORA_ANDROID_KEY_ALIAS: ${{ secrets.SONORA_ANDROID_KEY_ALIAS }}
          SONORA_ANDROID_KEY_PASSWORD: ${{ secrets.SONORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SONORA_ANDROID_KEYSTORE_BASE64 SONORA_ANDROID_KEYSTORE_PASSWORD SONORA_ANDROID_KEY_ALIAS SONORA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          export SONORA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/sonora-release.jks"
          printf "%s" "$SONORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SONORA_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SONORA_ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease -PsonoraVersionCode="$GITHUB_RUN_NUMBER" -PsonoraVersionName="0.1.$GITHUB_RUN_NUMBER"
      - name: Upload stable-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Android-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30