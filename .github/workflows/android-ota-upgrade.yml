name: SONORA Android OTA upgrade test

on:
  pull_request:
    branches: [main, "fix/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ota-upgrade.yml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonora-ota-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-upgrade:
    # Linux hosted runners in this repository have no /dev/kvm access.
    # Run the x86_64 emulator on macOS, where the Android emulator can use
    # the host hypervisor instead of timing out under software CPU emulation.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build stable-signed upgrade APK
        working-directory: apps/android
        env:
          SONORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SONORA_ANDROID_KEYSTORE_BASE64 }}
          SONORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SONORA_ANDROID_KEYSTORE_PASSWORD }}
          SONORA_ANDROID_KEY_ALIAS: ${{ secrets.SONORA_ANDROID_KEY_ALIAS }}
          SONORA_ANDROID_KEY_PASSWORD: ${{ secrets.SONORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SONORA_ANDROID_KEYSTORE_BASE64"
          export SONORA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/sonora-release.jks"
          printf "%s" "$SONORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SONORA_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SONORA_ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease -PsonoraVersionCode=999 -PsonoraVersionName=0.1.999
          mkdir -p "$GITHUB_WORKSPACE/ota-test"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ota-test/new.apk"

      - name: Download previous published SONORA APK
        run: |
          set -euo pipefail
          mkdir -p ota-test
          curl --fail --location --retry 3 \
            https://github.com/derector/SONORA/releases/download/v0.1.200/SONORA-release-v0.1.200.apk \
            -o ota-test/old.apk

      - name: Verify both APK signatures and versions
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          EXPECTED="23cb9f56b3a5fcaaceaddb9b2008d097138dfbc275327cb80a84cb023b26542a"
          for APK in ota-test/old.apk ota-test/new.apk; do
            OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
            DIGEST=$(grep 'Signer #1 certificate SHA-256 digest:' <<< "$OUT" | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]')
            test "$DIGEST" = "$EXPECTED"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$OUT"
            test "$("$APKANALYZER" manifest application-id "$APK")" = "app.sonora.android"
          done
          OLD_CODE=$("$APKANALYZER" manifest version-code ota-test/old.apk)
          NEW_CODE=$("$APKANALYZER" manifest version-code ota-test/new.apk)
          test "$NEW_CODE" -gt "$OLD_CODE"
          {
            echo "## OTA upgrade validation"
            echo "- Old versionCode: $OLD_CODE"
            echo "- New versionCode: $NEW_CODE"
            echo "- Both APKs use the pinned SONORA release certificate and APK Signature Scheme v2."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install old APK, update in place, and verify package state
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          emulator-boot-timeout: 600
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install ota-test/old.apk
            adb shell am force-stop app.sonora.android
            adb shell monkey -p app.sonora.android 1
            sleep 8
            OLD_PACKAGE=$(adb shell dumpsys package app.sonora.android | tr -d '\r' | grep -m1 'versionCode=')
            adb install -r ota-test/new.apk
            adb shell am force-stop app.sonora.android
            adb shell monkey -p app.sonora.android 1
            sleep 8
            NEW_PACKAGE=$(adb shell dumpsys package app.sonora.android | tr -d '\r' | grep -m1 'versionCode=')
            echo "Before update: $OLD_PACKAGE"
            echo "After update: $NEW_PACKAGE"
            echo "$OLD_PACKAGE" | grep -q 'versionCode=200'
            echo "$NEW_PACKAGE" | grep -q 'versionCode=999'
            adb shell pm path app.sonora.android
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/ota-test/updated-app.png"
            echo "Updated v0.1.200 to v0.1.999 using adb install -r; package remained installed and launched. This check does not yet seed/read an app-private data sentinel." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OTA upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonora-ota-upgrade-evidence
          path: ota-test/
          if-no-files-found: warn
          retention-days: 14
